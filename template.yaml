AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM Template for Jungle Tools Console (VPC Security Group & AWS Backup Monitor)

Parameters:
  ScanTargetAccountsJson:
    Type: String
    Default: '[]'
    Description: 'JSON string of target accounts to scan for backup reports'
  ObjectLockMode:
    Type: String
    Default: 'GOVERNANCE'
    AllowedValues:
      - 'GOVERNANCE'
      - 'COMPLIANCE'
    Description: 'S3 Object Lock retention mode (GOVERNANCE for develop/testing, COMPLIANCE for production)'
  ObjectLockRetentionDays:
    Type: Number
    Default: 30
    Description: 'Default retention period in days for S3 Object Lock audit logs'
  CrossAccountExternalId:
    Type: String
    Default: 'JungleToolsSecureExternalId'
    Description: 'External ID required for cross-account STS AssumeRole calls'

Conditions:
  IsDefaultStack: !Equals [!Ref "AWS::StackName", "jungle-tools-stack"]

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        AUDIT_LOG_TABLE: !Ref SgAuditLogsTable
        AUDIT_LOG_BUCKET: !Ref SgAuditLogsBucket
        SLACK_CONFIG_TABLE: !Ref SlackConfigTable
        USER_SESSIONS_TABLE: !Ref UserSessionsTable
        CROSS_ACCOUNT_EXTERNAL_ID: !Ref CrossAccountExternalId

Resources:
  # DynamoDB Table for User Sessions (BFF)
  UserSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [IsDefaultStack, "UserSessions", !Sub "${AWS::StackName}-UserSessions"]
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # DynamoDB Table for Slack Config
  SlackConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [IsDefaultStack, "SlackConfig", !Sub "${AWS::StackName}-SlackConfig"]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  # DynamoDB Table for Audit Logs
  SgAuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If [IsDefaultStack, "SgAuditLogs", !Sub "${AWS::StackName}-SgAuditLogs"]
      AttributeDefinitions:
        - AttributeName: sgId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: sgId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true

  # S3 Bucket for WORM Audit Logs with Object Lock
  SgAuditLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: !Ref ObjectLockMode
            Days: !Ref ObjectLockRetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # S3 Bucket Policy to enforce HTTPS-only access to Audit Logs
  SgAuditLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SgAuditLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceHttpsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${SgAuditLogsBucket}'
              - !Sub 'arn:aws:s3:::${SgAuditLogsBucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # Lambda Request Authorizer for BFF Session Cookies
  AuthAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: authorizer/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserSessionsTable

  # HttpApi (API Gateway v2) with Session Cookie Authorizer & CORS Enabled
  SgHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: SessionAuthorizer
        Authorizers:
          SessionAuthorizer:
            FunctionArn: !GetAtt AuthAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Cookie
              ReauthorizeEvery: 0
            EnableSimpleResponses: true
            AuthorizerPayloadFormatVersion: 2.0
      CorsConfiguration:
        AllowCredentials: true
        AllowOrigins:
          - !Sub "http://${SgFrontendBucket}.s3-website.${AWS::Region}.amazonaws.com"
          - !Sub "http://${SgFrontendBucket}.s3-website-${AWS::Region}.amazonaws.com"
          - !Sub "https://${SgFrontendBucket}.s3-website.${AWS::Region}.amazonaws.com"
          - !Sub "https://${SgFrontendBucket}.s3-website-${AWS::Region}.amazonaws.com"
          - "http://localhost:3000"
          - "http://localhost:5173"
          - "http://localhost:8080"
          - "http://127.0.0.1:3000"
          - "http://127.0.0.1:5173"
          - "http://127.0.0.1:8080"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Target-Role-Arn
          - X-Target-Region
          - X-Actor-Id
          - Cookie
        MaxAge: 600

  # Permission to allow API Gateway v2 to invoke the Request Authorizer
  AuthAuthorizerFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthAuthorizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SgHttpApi}/*"

  # BFF Auth: Login (STS Verification & Set-Cookie)
  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth/login.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSessionsTable

  # BFF Auth: Logout (Session Invalidation)
  AuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth/logout.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /auth/logout
            Method: POST
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSessionsTable

  # BFF Auth: Current Session Status
  AuthMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: auth/me.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /auth/me
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserSessionsTable

  # 1. Get Security Groups & VPCs Lambda Function
  GetSecurityGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getSecurityGroups/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /security-groups
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeSecurityGroups
                - ec2:DescribeVpcs
                - ec2:DescribeSubnets
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 1b. Get Security Group Connected Resources Lambda Function
  GetSecurityGroupResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getSecurityGroupResources/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /security-groups/{id}/resources
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeNetworkInterfaces
                - ec2:DescribeInstances
                - ec2:DescribeSecurityGroupRules
                - ec2:DescribeSecurityGroups
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 2. Create Security Group Lambda Function
  CreateSecurityGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: createSecurityGroup/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /security-groups
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SgAuditLogsTable
        - S3CrudPolicy:
            BucketName: !Ref SgAuditLogsBucket
        - Statement:
            - Effect: Allow
              Action:
                - ec2:CreateSecurityGroup
                - ec2:CreateTags
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 3. Update Security Group Rules Lambda Function
  UpdateSecurityGroupRulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: updateSecurityGroupRules/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /security-groups/{id}/rules
            Method: PUT
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SgAuditLogsTable
        - S3CrudPolicy:
            BucketName: !Ref SgAuditLogsBucket
        - Statement:
            - Effect: Allow
              Action:
                - ec2:AuthorizeSecurityGroupIngress
                - ec2:RevokeSecurityGroupIngress
                - ec2:AuthorizeSecurityGroupEgress
                - ec2:RevokeSecurityGroupEgress
                - ec2:DescribeSecurityGroups
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 4. Delete Security Group Lambda Function
  DeleteSecurityGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: deleteSecurityGroup/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /security-groups/{id}
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SgAuditLogsTable
        - S3CrudPolicy:
            BucketName: !Ref SgAuditLogsBucket
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DeleteSecurityGroup
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5. Get Audit Logs Lambda Function
  GetAuditLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getAuditLogs/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /audit-logs
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SgAuditLogsTable
        - S3ReadPolicy:
            BucketName: !Ref SgAuditLogsBucket

  # 5a. Get EBS Snapshots Lambda Function
  GetEbsSnapshotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getEbsSnapshots/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /backups/ebs
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeVolumes
                - ec2:DescribeSnapshots
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5a1. Get Snapshot Tracer Lambda Function (orphan snapshot detection)
  GetSnapshotTracerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getSnapshotTracer/app.handler
      Timeout: 60
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /backups/snapshot-tracer
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeVolumes
                - ec2:DescribeSnapshots
                - ec2:DescribeImages
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5a2. Delete Orphan Snapshot Lambda Function
  DeleteOrphanSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: deleteOrphanSnapshot/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /backups/snapshot-tracer/delete
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SgAuditLogsTable
        - S3CrudPolicy:
            BucketName: !Ref SgAuditLogsBucket
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DeleteSnapshot
                - ec2:DescribeVolumes
                - ec2:DescribeSnapshots
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5a3. Get AMI Tracer Lambda Function (AMI lifecycle & unused detection)
  GetAmiTracerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getAmiTracer/app.handler
      Timeout: 60
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /backups/ami-tracer
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeImages
                - ec2:DescribeInstances
                - ec2:DescribeLaunchTemplates
                - ec2:DescribeLaunchTemplateVersions
                - ec2:DescribeSnapshots
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5a4. Deregister AMI Lambda Function (Clean Deregister with snapshot cleanup)
  DeregisterAmiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: deregisterAmi/app.handler
      Timeout: 60
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /backups/ami-tracer/deregister
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SgAuditLogsTable
        - S3CrudPolicy:
            BucketName: !Ref SgAuditLogsBucket
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeImages
                - ec2:DeregisterImage
                - ec2:DeleteSnapshot
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5b. Get EFS Backups Lambda Function
  GetEfsBackupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getEfsBackups/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /backups/efs
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - elasticfilesystem:DescribeFileSystems
                - elasticfilesystem:DescribeBackupPolicy
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5c. Get RDS Backups Lambda Function
  GetRdsBackupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getRdsBackups/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /backups/rds
            Method: GET
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds:DescribeDBInstances
                - rds:DescribeDBSnapshots
                - rds:DescribeDBClusters
                - rds:DescribeDBClusterSnapshots
              Resource: "*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 5d. Get Slack Config Lambda Function
  GetSlackConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: getSlackConfig/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /slack/config
            Method: GET
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlackConfigTable

  # 5e. Save Slack Config Lambda Function
  SaveSlackConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: saveSlackConfig/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /slack/config
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlackConfigTable

  # 5f. Send Slack Notification Lambda Function
  SendSlackNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: sendSlackNotification/app.handler
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /slack/test
            Method: POST
        ReportEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /slack/report
            Method: GET
        PreviewEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /slack/preview
            Method: GET
        WebhookTestEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /slack/webhook/test
            Method: POST
        WebhookEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref SgHttpApi
            Path: /slack/webhook
            Method: POST
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 * * * ? *)
            Enabled: true
      Environment:
        Variables:
          SCAN_TARGET_ACCOUNTS: !Ref ScanTargetAccountsJson
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlackConfigTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeVolumes
                - ec2:DescribeSnapshots
                - elasticfilesystem:DescribeFileSystems
                - elasticfilesystem:DescribeBackupPolicy
                - rds:DescribeDBInstances
                - rds:DescribeDBSnapshots
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "arn:aws:iam::*:role/JungleToolsCrossAccountRole"

  # 6. S3 Bucket for Static Website Hosting
  SgFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # 7. S3 Bucket Policy to allow Public Read Access
  SgFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SgFrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${SgFrontendBucket}/*'

  # 8. IAM Role to allow cross-account API invocation from Hub Account
  JungleToolsApiInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [IsDefaultStack, "JungleToolsApiInvokeRole", !Sub "${AWS::StackName}-ApiInvokeRole"]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: ApiInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SgHttpApi}/*"

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Endpoint URL
    Value: !Sub "https://${SgHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendWebsiteUrl:
    Description: S3 Static Website URL
    Value: !GetAtt SgFrontendBucket.WebsiteURL
  AuditLogsBucketName:
    Description: S3 Audit Logs Bucket Name with Object Lock
    Value: !Ref SgAuditLogsBucket

