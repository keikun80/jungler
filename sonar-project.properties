# =====================================================================
# SonarCloud Static Analysis Configuration for Jungle Tools Console
# Organization: inhauslab
# Server: https://sonarcloud.io
# =====================================================================

# 1. SonarCloud Server & Organization
sonar.host.url=https://sonarcloud.io
sonar.organization=inhauslab

# 2. Project Identification
# SonarCloud에서 프로젝트 생성 시 지정된 Project Key를 입력합니다.
# (GitHub 연동 시 기본적으로 inhauslab_jungletools 또는 keikun80_jungletools)
sonar.projectKey=keikun80_jungletools
sonar.projectName=jungletools
sonar.projectVersion=1.0.0

# 3. Source & Test Directories
sonar.sources=backend,frontend
sonar.tests=backend/tests

# 4. Encodings and File Suffixes
sonar.sourceEncoding=UTF-8
sonar.javascript.file.suffixes=.js,.mjs,.jsx

# 5. Exclusions
sonar.exclusions=**/node_modules/**,**/.aws-sam/**,**/docs/**,**/scripts/**,backend/package-lock.json,backend/tests/**
sonar.test.inclusions=backend/tests/**

# 6. Test Reports (선택 사항: 단위 테스트 결과 및 커버리지 연동 시 사용)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
