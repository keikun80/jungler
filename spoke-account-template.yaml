AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cross-Account IAM Role Setup for Jungle Tools Console with ExternalId and Least Privilege Policies'

Parameters:
  HubAccountId:
    Type: String
    Default: '123456789012'
    Description: 'AWS Account ID of the Hub / Operator Account'
  RoleName:
    Type: String
    Default: 'JungleToolsCrossAccountRole'
    Description: 'Name of the Cross-Account IAM Role to create'
  ExternalId:
    Type: String
    Default: 'JungleToolsSecureExternalId'
    Description: 'External ID required for STS AssumeRole to prevent Confused Deputy attacks'

Resources:
  CrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${HubAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        # 1. Read-Only Monitoring Policy (AWS requires Resource: '*' for Describe* APIs)
        - PolicyName: JungleToolsReadOnlyMonitoringPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowReadOnlyResourceInspection
                Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSnapshots
                  - ec2:DescribeVolumes
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBClusters
                  - rds:DescribeDBClusterSnapshots
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeBackupPolicy
                Resource: '*'

        # 2. Security Group Management Policy (Scoped to Security Groups and VPCs)
        - PolicyName: JungleToolsSecurityGroupManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowSecurityGroupModification
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DeleteSecurityGroup
                  - ec2:CreateTags
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'

              - Sid: AllowSecurityGroupCreation
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*'

Outputs:
  RoleArn:
    Description: 'ARN of the created Cross-Account IAM Role'
    Value: !GetAtt CrossAccountRole.Arn
  ExternalId:
    Description: 'External ID configured for the Cross-Account IAM Role'
    Value: !Ref ExternalId
